<!DOCTYPE html>
<html>
<head>
    <title>PA2DK Loop Control</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="bootstrap.min.css" rel="stylesheet">
    <script src="main.js"></script>
    <style type="text/css">
        body{
            background: #D3D3D3;
            color: #fff;
        }
        #main{
            padding-top: 10px;
            margin: 0 auto;
            width: 400px;
            align-items: center;
        }
    </style>
</head>
<body class="d-flex justify-content-center pt-4">
    <div id="main" class="text-center" style="width: 400px;">
        <h1 class="mb-3">PA2DK Loop Control</h1>

        <!-- Buttons row(s) -->
        <div class="d-flex flex-wrap justify-content-center gap-2">
            <h3 class="mb-1">Single Loop</h3>
            <div class="w-100"></div> <!-- line break for a new row -->
            <button class="btn btn-dark" id="loop-a"><b>Loop A</b></button>
            <button class="btn btn-dark" id="loop-b"><b>Loop B</b></button>
            <!-- <button class="btn btn-dark" id="crossed"><b>A + B</b></button> -->

            <div class="w-100"></div> <!-- line break for a new row -->
            <h3 class="mb-1">Crossed Loops</h3>
            <div class="w-100"></div> <!-- line break for a new row -->
            <button class="btn btn-dark" id="minus-45"><b>-45&deg;</b></button>
            <button class="btn btn-dark" id="plus-45"><b>+45&deg;</b></button>

            <div class="w-100"></div> <!-- line break for a new row -->
            <div class="w-100"></div> <!-- line break for a new row -->
            <div class="w-100"></div> <!-- line break for a new row -->
            <div class="w-100"></div> <!-- line break for a new row -->

            <button class="btn btn-dark" id="vertical"><b>Vertical</b></button>
        </div>
    </div>
</body>
</html>
